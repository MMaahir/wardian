version: 2.1

executors:
  # A full arm64 VM with sudo, so Incus runs natively. The image tag is
  # dated, never current or edge.
  arm-vm:
    machine:
      image: ubuntu-2604:2026.11.1
    resource_class: arm.medium
    environment:
      CONTAINER: wardian-ci
      CI_TEMP: /tmp/wardian-ci
      UV_VERSION: 0.13.9
      UV_SHA256: 0797542018e541a9288855df555c8077eed06f7a47d206362030480e8ecc9f3d

commands:
  start-container:
    description: Start an Ubuntu 26.04 Incus container that Ansible reaches over SSH as root.
    steps:
      - run:
          name: Install uv
          command: |
            mkdir -p "$CI_TEMP" "$HOME/.local/bin"
            tarball=uv-aarch64-unknown-linux-gnu.tar.gz
            curl -fsSL -o "$CI_TEMP/$tarball" \
              "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/$tarball"
            echo "$UV_SHA256  $CI_TEMP/$tarball" | sha256sum --check
            tar -xzf "$CI_TEMP/$tarball" -C "$HOME/.local/bin" --strip-components=1
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

      - run:
          name: Install Incus
          command: |
            sudo apt-get update
            # incus-base is the container daemon without QEMU. Incus needs
            # dnsmasq for the bridge, which incus-base only recommends.
            sudo apt-get install --yes --no-install-recommends incus-base dnsmasq-base jq
            sudo incus admin init --minimal

      # The only change to the host's own networking. Docker on the host sets
      # the FORWARD policy to drop, which also drops the container's traffic
      # through the Incus bridge. The sandbox ruleset runs only inside the
      # container's network namespace.
      - run:
          name: Let the Incus bridge through Docker's firewall
          command: |
            sudo iptables -I DOCKER-USER -i incusbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

      # Without nesting, systemd 259 in the container hangs creating user
      # namespaces for journald, networkd and resolved, and the container
      # never gets an address. incus launch reads instance config from stdin
      # when stdin isn't a terminal, so give it none.
      - run:
          name: Start an Ubuntu 26.04 container
          command: |
            sudo incus launch images:ubuntu/26.04 "$CONTAINER" -c security.nesting=true < /dev/null
            for _ in $(seq 60); do
              ip=$(sudo incus query "/1.0/instances/$CONTAINER/state" \
                | jq -r '.network.eth0.addresses[]? | select(.family == "inet") | .address')
              [ -n "$ip" ] && break
              sleep 2
            done
            [ -n "$ip" ] || { echo "$CONTAINER got no IPv4 address"; exit 1; }
            # The container's resolver is the dnsmasq Incus runs on the bridge.
            resolver=$(sudo incus network get incusbr0 ipv4.address)
            echo "export CONTAINER_IP=$ip RESOLVER=${resolver%/*}" >> "$BASH_ENV"

      # Ansible reaches the container over SSH as root, with the host key
      # read through incus and checked strictly.
      - run:
          name: Open SSH into the container
          command: |
            sudo incus exec "$CONTAINER" --env DEBIAN_FRONTEND=noninteractive -- \
              sh -c 'apt-get update && apt-get install --yes openssh-server python3'
            ssh-keygen -q -t ed25519 -N '' -f "$CI_TEMP/id_ed25519"
            sudo incus file push --create-dirs --mode 0600 --uid 0 --gid 0 \
              "$CI_TEMP/id_ed25519.pub" "$CONTAINER/root/.ssh/authorized_keys"
            host_key=$(sudo incus exec "$CONTAINER" -- cat /etc/ssh/ssh_host_ed25519_key.pub)
            echo "$CONTAINER_IP $host_key" > "$CI_TEMP/known_hosts"

  provision:
    description: Apply the playbook to the container. The output goes to $CI_TEMP/provision.log.
    steps:
      - run:
          name: Provision
          environment:
            ANSIBLE_CONFIG: ansible/ansible.cfg
          command: |
            uv run --locked ansible-playbook \
              --inventory "$CONTAINER_IP," \
              --user root \
              --private-key "$CI_TEMP/id_ed25519" \
              --ssh-common-args "-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$CI_TEMP/known_hosts" \
              --extra-vars "wardian_resolver=$RESOLVER" \
              ansible/playbook.yml \
              | tee "$CI_TEMP/provision.log"

jobs:
  incus:
    executor: arm-vm
    steps:
      - checkout
      - start-container
      - provision
      - provision

      - run:
          name: Require no changes the second time
          command: |
            grep -E ': ok=[0-9]+ +changed=0 +unreachable=0 +failed=0 ' "$CI_TEMP/provision.log"

      # A positive control for the poweroff check below: with a good ruleset,
      # the container comes back up with nftables loaded.
      - run:
          name: Restart with the good ruleset
          command: |
            sudo incus restart "$CONTAINER"
            # systemctl fails until D-Bus is up, so poll until boot finishes.
            for _ in $(seq 60); do
              state=$(sudo incus exec "$CONTAINER" -- systemctl is-system-running 2>/dev/null) || true
              case "$state" in running|degraded) break ;; esac
              sleep 2
            done
            sudo incus exec "$CONTAINER" -- systemctl is-active nftables.service

      # The same script `wardian create` pipes the Keychain token into. The
      # token tests check the file it writes.
      - run:
          name: Install a fake Claude token
          command: |
            printf 'sk-ant-oat01-not-a-real-token' \
              | sudo incus exec "$CONTAINER" -- /usr/local/sbin/wardian-install-claude-token

      - run:
          name: Run the control tests
          command: |
            sudo incus exec "$CONTAINER" -- \
              /usr/bin/python3 -I /usr/local/lib/wardian/control_tests.py --env ci

      - run:
          name: A ruleset that fails to load powers the container off
          command: |
            sudo incus exec "$CONTAINER" -- sh -c 'echo "this line is not nft syntax" >> /etc/nftables.conf'
            sudo incus restart "$CONTAINER"
            for _ in $(seq 60); do
              status=$(sudo incus list "$CONTAINER" --format csv --columns s)
              if [ "$status" = STOPPED ]; then
                echo "$CONTAINER stopped"
                exit 0
              fi
              sleep 2
            done
            echo "$CONTAINER is still $status after 120 seconds"
            exit 1

  # Removes one control at a time and passes only if the tests for that
  # control fail. The incus job shows the same tests pass with every control
  # in place.
  mutation:
    executor: arm-vm
    steps:
      - checkout
      - start-container
      - provision

      # Each step deletes one rule from the live ruleset, so nftables.service
      # stays active. Breaking /etc/nftables.conf and restarting the service
      # instead would power the container off (FailureAction=poweroff) before
      # the tests ran. T06 must fail because the fixture answered both users, and the
      # reload puts the ruleset back.
      - run:
          name: Without the private-range drop, T06 fails
          command: |
            handle=$(sudo incus exec "$CONTAINER" -- nft -a list chain inet wardian output \
              | awk '/@private4/ { print $NF }')
            [ -n "$handle" ] || { echo "no private-range drop rule"; exit 1; }
            sudo incus exec "$CONTAINER" -- nft delete rule inet wardian output handle "$handle"
            sudo incus exec "$CONTAINER" -- \
              /usr/bin/python3 -I /usr/local/lib/wardian/control_tests.py --env ci --only T06 \
              | tee "$CI_TEMP/no-private-drop.jsonl" || true
            jq -e -s '[.[] | select(.id == "T06") | .result == "fail" and (.detail | contains("agent reached http://172.31.255.2:8080/") and contains("agent reached http://wardian-fixture.test:8080/") and contains("root reached http://172.31.255.2:8080/") and contains("root reached http://wardian-fixture.test:8080/"))] == [true]' \
              "$CI_TEMP/no-private-drop.jsonl" \
              || { echo "T06 must fail because agent and root reached the IPv4 fixture, by address and by name"; exit 1; }
            sudo incus exec "$CONTAINER" -- systemctl reload nftables.service

      - run:
          name: Without the IPv6 drop, T06 fails
          command: |
            handle=$(sudo incus exec "$CONTAINER" -- nft -a list chain inet wardian output \
              | awk '/nfproto ipv6/ { print $NF }')
            [ -n "$handle" ] || { echo "no IPv6 drop rule"; exit 1; }
            sudo incus exec "$CONTAINER" -- nft delete rule inet wardian output handle "$handle"
            sudo incus exec "$CONTAINER" -- \
              /usr/bin/python3 -I /usr/local/lib/wardian/control_tests.py --env ci --only T06 \
              | tee "$CI_TEMP/no-ipv6-drop.jsonl" || true
            jq -e -s '[.[] | select(.id == "T06") | .result == "fail" and (.detail | contains("agent reached http://[fd77:6172:6469::2]:8080/") and contains("root reached http://[fd77:6172:6469::2]:8080/"))] == [true]' \
              "$CI_TEMP/no-ipv6-drop.jsonl" \
              || { echo "T06 must fail because agent and root reached the IPv6 fixture"; exit 1; }
            sudo incus exec "$CONTAINER" -- systemctl reload nftables.service

      # Last, because it stops the container. Any change to inet wardian will
      # do: this one accepts the T06 fixture's address.
      - run:
          name: wardian-apt powers off after the firewall changes
          command: |
            sudo incus exec "$CONTAINER" -- \
              nft insert rule inet wardian output ip daddr 172.31.255.2 accept
            sudo incus exec --cwd / "$CONTAINER" -- \
              runuser -u agent -- sudo -n /usr/local/sbin/wardian-apt jq || true
            for _ in $(seq 60); do
              status=$(sudo incus list "$CONTAINER" --format csv --columns s)
              if [ "$status" = STOPPED ]; then
                echo "$CONTAINER stopped"
                exit 0
              fi
              sleep 2
            done
            echo "$CONTAINER is still $status after 120 seconds"
            exit 1

workflows:
  ci:
    jobs:
      - incus
      - mutation
