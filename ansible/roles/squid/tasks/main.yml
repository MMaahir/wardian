- name: Install Squid
  ansible.builtin.apt:
    name: squid
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the Squid config
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: "0644"
    validate: squid -k parse -f %s
  notify: Restart Squid

- name: Enable and start Squid
  ansible.builtin.systemd_service:
    name: squid.service
    enabled: true
    state: started
