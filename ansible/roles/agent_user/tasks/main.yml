# The unprivileged user the agents run as. useradd gives it no password, and
# groups "" keeps it out of every group but its own, so no sudoers rule
# (such as %sudo) matches it.
- name: Create the agent user
  ansible.builtin.user:
    name: agent
    shell: /bin/bash
    groups: ""
    create_home: true
  register: agent_user_account

# useradd gives a new user a subordinate ID range. With one, agent could run
# rootless containers whose processes the firewall sees under other UIDs.
# The range depends on which users came first, so match the line instead.
- name: Remove agent's subordinate user and group IDs
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^(agent|{{ agent_user_account.uid }}):"
    state: absent
  loop:
    - /etc/subuid
    - /etc/subgid

# The sandbox's own key for agent, made by `wardian create` on the Mac. It is
# the only key, so agent can log in only with it. agent owns the file and may
# add keys, which gives it nothing: sshd limits every agent login the same way.
- name: Create agent's .ssh directory
  ansible.builtin.file:
    path: /home/agent/.ssh
    state: directory
    owner: agent
    group: agent
    mode: "0700"

- name: Install agent's authorized key
  ansible.builtin.copy:
    content: "{{ wardian_agent_key }}\n"
    dest: /home/agent/.ssh/authorized_keys
    owner: agent
    group: agent
    mode: "0600"
