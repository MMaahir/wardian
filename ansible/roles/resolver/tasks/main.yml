# The sandbox's only resolver is wardian_resolver. Every user may reach it on
# port 53, and nftables drops every other private address (see the nftables
# role). systemd-resolved would be a second path: a local stub on 127.0.0.53
# and a D-Bus and varlink API that any user can query.

# The file replaces the symlink to resolved's stub file, so resolution keeps
# working for the tasks after resolved stops.
- name: Write a static resolver file
  ansible.builtin.copy:
    content: |
      # Wardian: the sandbox's only resolver. systemd-resolved is masked.
      nameserver {{ wardian_resolver }}
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"

# The sockets go first, so nothing restarts the service through them.
- name: Stop and mask systemd-resolved
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    masked: true
  loop:
    - systemd-resolved-varlink.socket
    - systemd-resolved-monitor.socket
    - systemd-resolved.service
