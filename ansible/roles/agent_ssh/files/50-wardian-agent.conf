# Wardian: an SSH login as agent gets one local forward, to T3's port in the
# guest, and nothing else. sshd opens the forwarded connection as agent, so
# the firewall limits it too.
Match User agent
	AllowTcpForwarding local
	PermitOpen 127.0.0.1:3773
	PermitListen none
	AllowAgentForwarding no
	AllowStreamLocalForwarding no
	X11Forwarding no
	PermitTunnel no
