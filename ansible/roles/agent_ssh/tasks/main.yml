# systemd-ssh-generator makes sshd-vsock.socket on a VM with vsock, even with
# Lima's ssh.overVsock false, and sshd-unix-local.socket, which the spike found
# open to every local user. Only ssh.socket, ordered after the firewall,
# should listen. Masking a unit that doesn't exist, as in CI, works too.
- name: Mask the vsock and local SSH sockets
  ansible.builtin.command:
    argv: [systemctl, mask, sshd-vsock.socket, sshd-unix-local.socket]
  register: agent_ssh_sockets_masked
  changed_when: "'Created symlink' in agent_ssh_sockets_masked.stderr"

# Masking doesn't stop a socket that is listening. systemctl exits 5 for a
# unit that was never loaded.
- name: Stop the vsock and local SSH sockets  # noqa: no-handler - it must run at this point in the play, not at the end
  ansible.builtin.command:
    argv: [systemctl, stop, sshd-vsock.socket, sshd-unix-local.socket]
  register: agent_ssh_sockets_stopped
  when: agent_ssh_sockets_masked is changed
  changed_when: true
  failed_when: agent_ssh_sockets_stopped.rc not in [0, 5]

# sshd keeps the first value it reads for each option, and Ubuntu's
# sshd_config includes sshd_config.d before its own settings, so this block
# wins for agent. The control tests check the result with sshd -T.
- name: Limit what SSH gives agent
  ansible.builtin.copy:
    src: 50-wardian-agent.conf
    dest: /etc/ssh/sshd_config.d/50-wardian-agent.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd

- name: Check the sshd config
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -t]
  changed_when: false
