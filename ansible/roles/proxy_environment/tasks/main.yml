# Points every login session at Squid. pam_env reads /etc/environment for
# SSH logins and for sudo, so after this task apt and get_url in the
# playbook's own sessions go through Squid too, and Squid denies their hosts.
# That is why this role runs last.
#
# Lima writes its own block into this file. blockinfile edits only the lines
# between its markers.
- name: Send agent's traffic through Squid
  ansible.builtin.blockinfile:
    path: /etc/environment
    marker: "# {mark} WARDIAN PROXY"
    block: |
      http_proxy=http://127.0.0.1:3128
      https_proxy=http://127.0.0.1:3128
      HTTP_PROXY=http://127.0.0.1:3128
      HTTPS_PROXY=http://127.0.0.1:3128
      no_proxy=localhost,127.0.0.1,::1
      NO_PROXY=localhost,127.0.0.1,::1
    owner: root
    group: root
    mode: "0644"
