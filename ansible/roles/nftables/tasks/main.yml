- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

# A typo fails the playbook here, not the next boot.
- name: Install the ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  register: nftables_ruleset
  notify: Reload nftables

- name: Create the nftables.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Power off when the ruleset fails to load
  ansible.builtin.copy:
    src: 50-wardian.conf
    dest: /etc/systemd/system/nftables.service.d/50-wardian.conf
    owner: root
    group: root
    mode: "0644"
  register: nftables_dropin

# Ubuntu's SSH is socket-activated: ssh.socket listens and starts
# ssh.service. Both get the ordering, in case ssh.service starts on its own.
- name: Create the SSH drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [ssh.socket, ssh.service]

- name: Start SSH only after the firewall
  ansible.builtin.copy:
    src: 50-wardian-nftables.conf
    dest: "/etc/systemd/system/{{ item }}.d/50-wardian-nftables.conf"
    owner: root
    group: root
    mode: "0644"
  loop: [ssh.socket, ssh.service]
  register: nftables_ssh_ordering

# The kernel tracks connections only while a loaded rule uses conntrack, and
# on a fresh guest none does. When the drop policy loads, the kernel picks up
# Ansible's open SSH connection mid-stream as new and drops sshd's replies,
# and the play hangs. This table tracks every packet and accepts it, so the
# connection is already established when the drop policy loads.
- name: Track connections before the ruleset loads  # noqa: no-handler - it must run at this point in the play, not at the end
  ansible.builtin.command:
    argv: [nft, -f, -]
    stdin: |
      table inet wardian_handover {
        chain output {
          type filter hook output priority filter; policy accept;
          ct state established,related accept
        }
      }
  when: nftables_ruleset is changed
  changed_when: true

- name: Enable and start nftables
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: true
    state: started
    daemon_reload: "{{ nftables_dropin is changed or nftables_ssh_ordering is changed }}"

- name: Load the ruleset now
  ansible.builtin.meta: flush_handlers

- name: Remove the handover table  # noqa: no-handler - it must run at this point in the play, not at the end
  ansible.builtin.command:
    argv: [nft, delete, table, inet, wardian_handover]
  when: nftables_ruleset is changed
  changed_when: true

- name: Check the nftables unit and its drop-in
  ansible.builtin.command:
    argv: [systemd-analyze, verify, --man=no, nftables.service]
  changed_when: false
