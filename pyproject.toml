[project]
name = "wardian"
version = "0.1.0"
description = "Run AI coding agents in disposable Lima VMs on a Mac."
license = "Apache-2.0"
requires-python = ">=3.13"
# The CLI uses only the standard library at runtime.
dependencies = []

[project.scripts]
wardian = "wardian.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]
# ansible-playbook is a program the CLI runs, not a library it imports.
provision = ["ansible-core"]

[tool.uv]
default-groups = ["dev", "provision"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["B", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# subprocess is the CLI's job, and the arguments are lists, never shell strings.
"src/wardian/cli.py" = ["S603", "S607"]
"ansible/roles/control_tests/files/control_tests.py" = ["S603"]
# apt-get and systemd-run get package names that passed the name regex.
"ansible/roles/wardian_apt/files/*.py" = ["S603"]
"tests/*" = ["S101"]
# The Lima tests run git on the Mac, as the docs tell the user to.
"tests/test_lima_git.py" = ["S603", "S607"]
# They run ssh and ssh-agent on the Mac, as T3 would.
"tests/test_lima_agent_ssh.py" = ["S603", "S607"]

[tool.pytest.ini_options]
markers = ["lima: needs a running Lima sandbox named in WARDIAN_LIMA_SANDBOX"]
